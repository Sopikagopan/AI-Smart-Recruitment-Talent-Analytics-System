services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: recruitment_backend
    ports:
      - "8001:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: recruitment_frontend
    ports:
      - "8502:8501"
    environment:
      API_URL: http://backend:8000/predict
    depends_on:
      - backend
    restart: unless-stopped 